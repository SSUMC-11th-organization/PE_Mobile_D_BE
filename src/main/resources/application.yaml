spring:
  application:
    name: "umc-study"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    hibernate:
      ddl-auto: validate # 서버가 실행될 때 자바 코드로 작성한 엔티티(Entity) 구조와 실제 테이블 구조가 일치하는지 검증
    open-in-view: false # 불필요한 데이터베이스 커넥션 유지를 방지